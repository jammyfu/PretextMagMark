<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pretext / Social Layout</title>
<style>
  * { box-sizing: border-box; }
  :root {
    color-scheme: light;
    --page: #efe3d2;
    --panel: rgba(255, 249, 241, 0.92);
    --ink: #221816;
    --muted: #725f56;
    --rule: rgba(72, 40, 26, 0.12);
    --accent: #c34f39;
    --accent-soft: #f2d5c6;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background:
      radial-gradient(circle at 10% 10%, rgba(195, 79, 57, 0.18), transparent 22%),
      radial-gradient(circle at 90% 0%, rgba(110, 73, 42, 0.12), transparent 18%),
      linear-gradient(180deg, #f6eee2 0%, var(--page) 100%);
    color: var(--ink);
    font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
  }
  .card {
    width: min(760px, calc(100vw - 28px));
    padding: 32px;
    border: 1px solid var(--rule);
    border-radius: 30px;
    background: var(--panel);
    box-shadow: 0 28px 90px rgba(63, 35, 20, 0.16);
  }
  .eyebrow {
    margin: 0 0 10px;
    color: var(--accent);
    font: 700 12px/1.1 "Consolas", "SFMono-Regular", ui-monospace, monospace;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  h1 {
    margin: 0;
    font: 700 clamp(34px, 5vw, 52px)/0.96 Georgia, "Times New Roman", "Songti SC", serif;
    letter-spacing: -0.03em;
  }
  p {
    margin: 14px 0 0;
    color: var(--muted);
    line-height: 1.65;
    font-size: 16px;
  }
  .meta {
    display: grid;
    gap: 8px;
    margin-top: 24px;
    padding: 16px 18px;
    border-radius: 20px;
    background: rgba(255,255,255,0.54);
    border: 1px solid var(--rule);
  }
  .meta strong {
    color: var(--ink);
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 24px;
  }
  .button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 150px;
    padding: 14px 18px;
    border-radius: 999px;
    text-decoration: none;
    font: 700 14px/1 "Segoe UI", "PingFang SC", sans-serif;
    transition: transform 140ms ease, opacity 140ms ease;
  }
  .button:hover { transform: translateY(-1px); }
  .button--primary {
    color: white;
    background: linear-gradient(135deg, #d6614c 0%, #b63e2b 100%);
  }
  .button--secondary {
    color: var(--ink);
    background: linear-gradient(135deg, rgba(255,255,255,0.92), rgba(247, 236, 223, 0.95));
    box-shadow: inset 0 0 0 1px rgba(53, 34, 25, 0.12);
  }
  @media (max-width: 640px) {
    .card { padding: 24px; }
    .actions { flex-direction: column; }
    .button { width: 100%; }
  }
</style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Pretext / Social Layout</p>
    <h1>当前项目默认只展示精细化 Social 排版功能</h1>
    <p>
      运行项目后，默认入口已经收敛到 Markdown 海报排版能力：
      支持导入 Markdown、按小红书卡片或长图进行精细排版，并导出高分辨率 PNG。
    </p>

    <section class="meta" aria-label="Feature summary">
      <div><strong>目标版式：</strong>小红书 1080×1440、多页导出、长图 1080×Auto</div>
      <div><strong>排版核心：</strong>基于 Pretext 的 `prepareWithSegments()` 与 `layoutNextLine()`</div>
      <div><strong>导出方式：</strong>浏览器 Canvas 2x / 3x / 4x PNG</div>
    </section>

    <div class="actions">
      <a class="button button--primary" href="/demos/markdown-poster">打开精细排版页</a>
      <a class="button button--secondary" href="/">刷新默认入口</a>
    </div>
  </main>
</body>
</html>
